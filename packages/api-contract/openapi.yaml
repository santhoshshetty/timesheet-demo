openapi: 3.0.3
info:
  title: timesheet-demo Project Management API
  version: 1.0.0
  description: |
    Project Management API for feature `001-project-management`.

    **Development-only (FR-036):** this API has no authentication or authorization and MUST NOT be
    deployed to production (Constitution v1.3.0, Principle III development-only exemption).

    Errors use RFC 9457 Problem Details (`application/problem+json`). Structural validation
    failures return `400`; business-rule violations return `422`. Both include field-level
    `errors[]`. Requests to undocumented paths return `404` with code `ROUTE_NOT_FOUND`;
    unsupported methods on documented paths return `405` with code `METHOD_NOT_ALLOWED`.
servers:
  - url: /
tags:
  - name: Projects
  - name: Health
paths:
  /api/v1/projects:
    get:
      tags: [Projects]
      operationId: listProjects
      summary: List and search non-deleted projects
      parameters:
        - name: search
          in: query
          description: >-
            Case-insensitive substring match against project name, charge code, Project Manager
            name, Project Manager email, and Client Name (FR-017). Leading/trailing spaces are
            ignored; an empty value means no filter. Free text, so reserved characters (such as
            `+` for a form-encoded space) are allowed.
          allowReserved: true
          schema: { type: string, maxLength: 100 }
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, chargeCode, startDate, endDate]
            default: name
        - name: order
          in: query
          schema: { type: string, enum: [asc, desc], default: asc }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200':
          description: A page of projects (may be empty)
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Projects]
      operationId: createProject
      summary: Create a project (charge code is generated by the system)
      description: >-
        Any `chargeCode` property in the body is rejected (FR-013). Repeating a request with the
        same `Idempotency-Key` returns the project created by the first request with `200`
        instead of creating a duplicate (FR-009).
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Client-generated UUID, created when the create form is opened.
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectInput' }
      responses:
        '201':
          description: Project created
          headers:
            Location:
              description: URL of the new project
              schema: { type: string }
            ETag: { $ref: '#/components/headers/ETag' }
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '200':
          description: Replay of an already-processed create request (same Idempotency-Key)
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404':
          description: The Idempotency-Key belongs to a project that has since been deleted
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409': { $ref: '#/components/responses/NameTaken' }
        '422': { $ref: '#/components/responses/BusinessRuleViolation' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503':
          description: A unique charge code could not be generated; nothing was saved (FR-015)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: about:blank
                title: Charge code unavailable
                status: 503
                code: CHARGE_CODE_UNAVAILABLE
                detail: The project could not be created. Please try again.
                requestId: 7b0f6c1e-3d2a-4f7e-9a51-2a4f0c9d8e11
  /api/v1/projects/{projectId}:
    parameters:
      - name: projectId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Projects]
      operationId: getProject
      summary: Get a non-deleted project
      responses:
        '200':
          description: The project
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      tags: [Projects]
      operationId: updateProject
      summary: Replace the editable fields of a project
      description: >-
        All editable fields are sent. `chargeCode` cannot be changed (FR-013, FR-014).
        `If-Match` is required by this operation and must carry the current ETag; a missing header
        returns `428`, a malformed value returns `400`, and a stale value returns `412` (FR-020).
      parameters:
        - name: If-Match
          in: header
          required: false
          description: >-
            **Required by this operation.** The quoted version from the ETag, e.g. `"3"`. Marked
            optional in the schema so that the handler, not the request validator, enforces it:
            missing → `428 PRECONDITION_REQUIRED`; not a quoted positive integer →
            `400 VALIDATION_FAILED` (field `If-Match`, code `INVALID_FORMAT`); stale →
            `412 VERSION_CONFLICT`.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectInput' }
      responses:
        '200':
          description: Project updated
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/NameTaken' }
        '412':
          description: The project was changed by someone else since it was loaded
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: about:blank
                title: Project was changed by someone else
                status: 412
                code: VERSION_CONFLICT
                detail: Reload the project to see the latest changes, then try again.
                requestId: 7b0f6c1e-3d2a-4f7e-9a51-2a4f0c9d8e11
        '422': { $ref: '#/components/responses/BusinessRuleViolation' }
        '428':
          description: The If-Match header is missing (enforced by the handler)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: about:blank
                title: If-Match header required
                status: 428
                code: PRECONDITION_REQUIRED
                detail: Send the project's current ETag in the If-Match header.
                requestId: 7b0f6c1e-3d2a-4f7e-9a51-2a4f0c9d8e11
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [Projects]
      operationId: deleteProject
      summary: Soft-delete a project
      description: >-
        Marks the project as deleted. Its data and charge code are kept and the charge code is
        never reused. Restore and permanent purge are not available (FR-021, FR-022).
      responses:
        '204':
          description: Project deleted
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /health/live:
    get:
      tags: [Health]
      operationId: liveness
      summary: Process is running
      responses:
        '200':
          description: Alive
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthStatus' }
  /health/ready:
    get:
      tags: [Health]
      operationId: readiness
      summary: Service can handle requests (database reachable)
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthStatus' }
        '503':
          description: Not ready (database unavailable)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthStatus' }
components:
  headers:
    ETag:
      description: Current version of the project, quoted, e.g. `"3"`.
      schema: { type: string }
    X-Request-Id:
      description: Correlation ID for this request (echoed from the request or generated).
      schema: { type: string, format: uuid }
  schemas:
    ProjectType:
      type: string
      enum: [INTERNAL, CLIENT]
      description: '`INTERNAL` = Internal Project, `CLIENT` = Client Project'
    BillingType:
      type: string
      enum: [BILLABLE, NON_BILLABLE]
    ProjectManager:
      type: object
      additionalProperties: false
      required: [name, email]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Not blank after trimming.
        email:
          type: string
          format: email
          maxLength: 254
          description: Stored and compared in lower case. Future link to the identity system (FR-024).
    ProjectInput:
      type: object
      additionalProperties: false
      required: [name, projectManager, startDate, endDate, projectType, billingType]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Trimmed; not blank; unique among non-deleted projects ignoring case.
        projectManager: { $ref: '#/components/schemas/ProjectManager' }
        startDate:
          type: string
          format: date
          description: On create, not earlier than today (business time zone). On edit, if changed, not earlier than today.
        endDate:
          type: string
          format: date
          description: On or after startDate. On edit, not earlier than the currently saved endDate.
        projectType: { $ref: '#/components/schemas/ProjectType' }
        clientName:
          type: string
          nullable: true
          maxLength: 100
          description: Required (not blank) when projectType is CLIENT. Ignored and stored as null when INTERNAL.
        billingType: { $ref: '#/components/schemas/BillingType' }
    Project:
      type: object
      additionalProperties: false
      required:
        - id
        - chargeCode
        - name
        - projectManager
        - startDate
        - endDate
        - projectType
        - clientName
        - billingType
        - version
        - createdAt
        - updatedAt
      properties:
        id: { type: string, format: uuid }
        chargeCode:
          type: string
          pattern: '^[0-9]{8}$'
          example: '00412345'
          description: System-generated; 8 digits; leading zeros preserved; never changes.
        name: { type: string, maxLength: 100 }
        projectManager: { $ref: '#/components/schemas/ProjectManager' }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        projectType: { $ref: '#/components/schemas/ProjectType' }
        clientName: { type: string, nullable: true, maxLength: 100 }
        billingType: { $ref: '#/components/schemas/BillingType' }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ProjectPage:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, totalItems, totalPages]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Project' }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        totalItems: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
    FieldError:
      type: object
      additionalProperties: false
      required: [field, code, message]
      properties:
        field:
          type: string
          description: >-
            Dotted path of the body field (e.g. `projectManager.email`), the query parameter name
            (e.g. `pageSize`), or the header name (e.g. `If-Match`).
        code:
          type: string
          enum:
            - REQUIRED
            - TOO_LONG
            - INVALID_FORMAT
            - INVALID_EMAIL
            - INVALID_DATE
            - INVALID_VALUE
            - UNKNOWN_FIELD
            - START_DATE_IN_PAST
            - END_BEFORE_START
            - END_DATE_SHORTENED
            - CLIENT_NAME_REQUIRED
        message: { type: string }
    Problem:
      type: object
      required: [type, title, status, code, requestId]
      properties:
        type: { type: string, default: about:blank }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code:
          type: string
          enum:
            - VALIDATION_FAILED
            - BUSINESS_RULE_VIOLATION
            - PROJECT_NOT_FOUND
            - PROJECT_NAME_TAKEN
            - VERSION_CONFLICT
            - PRECONDITION_REQUIRED
            - CHARGE_CODE_UNAVAILABLE
            - ROUTE_NOT_FOUND
            - METHOD_NOT_ALLOWED
            - INTERNAL_ERROR
        requestId: { type: string, format: uuid }
        errors:
          type: array
          items: { $ref: '#/components/schemas/FieldError' }
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, unavailable] }
  responses:
    BadRequest:
      description: >-
        Request is structurally invalid (missing/unknown fields, wrong types or formats, values out
        of range, or a malformed If-Match header)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: about:blank
            title: Request validation failed
            status: 400
            code: VALIDATION_FAILED
            requestId: 7b0f6c1e-3d2a-4f7e-9a51-2a4f0c9d8e11
            errors:
              - field: name
                code: REQUIRED
                message: Project name is required.
              - field: chargeCode
                code: UNKNOWN_FIELD
                message: Charge code is generated by the system and cannot be supplied.
    BusinessRuleViolation:
      description: Request is well-formed but breaks a business rule
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: about:blank
            title: Project data is not valid
            status: 422
            code: BUSINESS_RULE_VIOLATION
            requestId: 7b0f6c1e-3d2a-4f7e-9a51-2a4f0c9d8e11
            errors:
              - field: startDate
                code: START_DATE_IN_PAST
                message: Start date cannot be in the past.
              - field: clientName
                code: CLIENT_NAME_REQUIRED
                message: Client name is required for Client Projects.
    NotFound:
      description: Project does not exist or has been deleted
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: about:blank
            title: Project not found
            status: 404
            code: PROJECT_NOT_FOUND
            requestId: 7b0f6c1e-3d2a-4f7e-9a51-2a4f0c9d8e11
    NameTaken:
      description: Another non-deleted project already uses this name (ignoring case)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: about:blank
            title: Project name already in use
            status: 409
            code: PROJECT_NAME_TAKEN
            requestId: 7b0f6c1e-3d2a-4f7e-9a51-2a4f0c9d8e11
            errors:
              - field: name
                code: INVALID_VALUE
                message: A project with this name already exists.
    InternalError:
      description: Unexpected error; no internal details are returned
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: about:blank
            title: Something went wrong
            status: 500
            code: INTERNAL_ERROR
            detail: Please try again. If the problem continues, contact support with the request ID.
            requestId: 7b0f6c1e-3d2a-4f7e-9a51-2a4f0c9d8e11
